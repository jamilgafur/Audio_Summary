services:
  paper-reader:
    build:
      context: .
      args:
        # 1070 Ti = Pascal = compute capability 6.1. Drop to just "61" once you
        # know it works; keeping 61;70;75 costs build time, nothing else.
        BASE: nvidia/cuda:12.4.1-devel-ubuntu22.04
        CMAKE_ARGS: "-DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=61"
    ports:
      - "8000:8000"
    volumes:
      - ./input:/data/input
      - ./output:/data/output
      - ./models:/data/models
    environment:
      GGUF_REPO: bartowski/Qwen2.5-7B-Instruct-GGUF   # any instruct GGUF works; try 14B on that 48GB RAM
      GGUF_FILE: Qwen2.5-7B-Instruct-Q4_K_M.gguf
      N_GPU_LAYERS: "-1"                              # -1: everything on the 1070 Ti; 0: CPU only
      VOICE: af_heart
      SPEED: "1.1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:                # without this, container logs eventually eat the disk
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
